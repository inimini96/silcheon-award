 else if(V==='book'){const b=B[cb-1],a=ps(cb);h+='<button class="back" onclick="go(\'list\')">‹ 책 목록으로</button><div class="box"><div class="bh">'+covers(b)+'<div>'+binfo(cb,b)+'<div class="ba">추천 글 '+a.length+'개</div></div><div style="margin-left:auto;min-width:160px"><button class="write" onclick="go(\'form\','+cb+')">추천 이유 쓰기</button></div></div><div class="grid">'+a.map(card).join('')+'</div></div>'}
 else if(V==='post'){const p=D.find(x=>x.id===cp);if(!p){V='list';return render()}const b=B[p.b-1],a=ps(p.b),k=a.indexOf(p);
  h+='<button class="back" onclick="go(\'book\','+p.b+')">‹ '+b[0]+' 글 모두 보기</button><div class="box dv"><div class="big">'+b[3].split('|').map(x=>'<img src="'+cov(x)+'" alt="">').join('')+binfo(p.b,b)+'</div><div><div class="who" style="font-size:15px">'+who(p)+'</div><div class="full">'+esc(p.c)+'</div><div class="ph" id="ph"></div><div class="nav">'+(k>0?'<button class="pill" onclick="go(\'post\','+p.b+',\''+a[k-1].id+'\')">‹ 이전 글</button>':'')+(k<a.length-1?'<button class="pill" onclick="go(\'post\','+p.b+',\''+a[k+1].id+'\')">다음 글 ›</button>':'')+'<span class="ba">'+(k+1)+' / '+a.length+'</span><span style="margin-left:auto"></span><button class="pill" onclick="go(\'form\','+p.b+',\''+p.id+'\')">수정</button><button class="pill" onclick="askDel(\''+p.id+'\')">삭제</button></div><div class="nav" id="dz"></div></div></div>';
  if(p.img)setTimeout(()=>photos(p),0)}
 else if(V==='form'){const b=B[cb-1],p=cp?D.find(x=>x.id===cp):null,me=ls('me')||{},dr=!p&&ls('draft_'+G+cb);const v=p||Object.assign({n:me.n||'',s:me.s||'',gr:me.gr||'',c:''},dr||{});
  h+='<button class="back" onclick="go('+(p?'\'post\','+cb+',\''+p.id+'\'':(G==='유'?'\'kb\','+cb:'\'list\''))+')">‹ 돌아가기</button><div class="box"><div class="bh">'+covers(b)+'<div>'+binfo(cb,b)+'</div></div><div class="f">'+(dr&&dr.c?'<div class="ok">쓰던 글을 불러왔어요. 이어서 써 주세요.</div>':'')+
  '<div class="row"><div><label for="fn">별명</label><input id="fn" maxlength="15" value="'+esc(v.n)+'"></div><div><label for="fs">학교</label><input id="fs" maxlength="20" placeholder="세미초" value="'+esc(v.s)+'"></div><div><label for="fg">학년 (안 골라도 돼요)</label><select id="fg"><option value="">선택 안 함</option>'+DIV[G].gr.map(g=>'<option>'+g+'</option>').join('')+'</select></div></div>'+
  '<div><label for="fc">추천 이유</label><textarea id="fc" maxlength="1500" placeholder="이 책을 추천하는 까닭을 써 주세요">'+esc(v.c)+'</textarea></div><div><label for="fp">'+(p?'글 비밀번호 4자리':'비밀번호 4자리 (고치거나 지울 때 써요)')+'</label><input id="fp" maxlength="4" inputmode="numeric" style="max-width:200px"></div><div class="err" id="fe"></div><button class="write" id="fb" style="max-width:240px" onclick="save()">'+(p?'고치기':'올리기')+'</button></div></div>';
  $('app').innerHTML=h+vote();$('fg').value=v.gr||'';document.querySelectorAll('.f input,.f textarea,.f select').forEach(e=>e.oninput=()=>{$('fe').textContent='';if(!cp)saveDraft()});return}
 const sx=$('shelf')?$('shelf').scrollLeft:0;a.innerHTML=h+vote();
 if(V==='list'&&$('shelf')){const s=$('shelf');s.scrollLeft=sx;s.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;const m=s.scrollWidth-s.clientWidth;if((e.deltaY>0&&s.scrollLeft<m-1)||(e.deltaY<0&&s.scrollLeft>0)){s.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})}}
function saveDraft(){if(V!=='form'||cp||!$('fc'))return;ls('draft_'+G+cb,{n:$('fn').value,s:$('fs').value,gr:$('fg').value,c:$('fc').value})}
function val(){const o={g:G,b:cb,n:$('fn').value.trim(),s:sch($('fs').value),gr:$('fg').value,c:$('fc').value.trim(),pw:$('fp').value.trim()};
 if(!o.n||!o.s||!o.c)return '별명, 학교, 추천 이유를 모두 써 주세요.';if(!/^\d{4}$/.test(o.pw))return '비밀번호는 숫자 4자리로 써 주세요.';return o}
async function save(){const o=val();if(typeof o==='string'){$('fe').textContent=o;return}
 ls('me',{n:o.n,s:o.s,gr:o.gr});$('fb').disabled=true;$('fb').textContent='올리는 중…';
 try{const r=await send(cp?'edit':'add',Object.assign({id:cp},o));ls('draft_'+G+cb,null);
  if(cp){Object.assign(D.find(x=>x.id===cp),{n:o.n,s:o.s,gr:o.gr,c:o.c});go('post',cb,cp)}else{const p={id:String(r.id),g:G,b:cb,s:o.s,gr:o.gr,c:o.c,img:'',n:o.n};D.push(p);mine.push(p);go(G==='유'?'kb':'book',cb)}}
 catch(e){$('fe').textContent=e.message||e;$('fb').disabled=false;$('fb').textContent=cp?'고치기':'올리기'}}
function askDel(id){$('dz').innerHTML='<input id="dp" maxlength="4" inputmode="numeric" placeholder="비밀번호 4자리" style="border:1.5px solid #CFC9BC;border-radius:10px;padding:7px 10px;width:150px;font-size:15px"><button class="pill" onclick="del_(\''+id+'\')">지우기</button><span class="err" id="de"></span>';$('dp').focus()}
async function del_(id){const pw=$('dp').value.trim();if(!/^\d{4}$/.test(pw)){$('de').textContent='비밀번호는 숫자 4자리예요.';return}try{await send('del',{id,pw});D=D.filter(x=>x.id!==id);go(G==='유'?'kb':'book',cb)}catch(e){$('de').textContent=e.message||e}}
async function photos(p){try{if(!PH)PH=await (await fetch('photos.json')).json();if(cp===p.id)$('ph').innerHTML=String(p.img).split(',').map(k=>PH[k.trim()]?'<img src="'+PH[k.trim()]+'" alt="학급 활동 사진">':'').join('')}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function send(act,o){for(let i=0;i<4;i++){try{const r=await post(act,o);if(r.ok)return r;throw Object.assign(new Error(r.msg),{hard:1})}catch(e){if(e.hard||i===3)throw e;await wait(1500*(i+1)+Math.random()*1500)}}}

const VOFF={};function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(f);f=''}else if(ch==='\n'){r.push(f);R.push(r);r=[];f=''}else if(ch!=='\r')f+=ch}if(f||r.length){r.push(f);R.push(r)}return R}
const PK='pend_v1';
function pend(){const now=Date.now();return (ls(PK)||[]).filter(x=>now-x.t<600000)}
async function loadData(){const r=await fetch(CFG.csv+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('load');
 const A=csv(await r.text()),h=(A[0]||[])[8]||'';if(h.indexOf('vote:')===0)['유','저','중','고'].forEach((g,i)=>VOFF[g]=h[5+i]==='0');let d=A.slice(1).filter(x=>x[0]).map(x=>({id:String(x[0]),g:x[1],b:Number(x[2]),s:x[3],gr:x[4],c:x[5],img:x[6]||'',n:x[7]||''}));
 pend().forEach(x=>{const i=d.findIndex(p=>p.id===x.p.id);if(x.a==='del'){if(i>=0)d.splice(i,1)}else if(x.a==='edit'){if(i>=0)Object.assign(d[i],x.p)}else if(i<0)d.push(x.p)});return d}
async function post(act,o){if(!CFG.api)return {ok:false,msg:'글쓰기 주소가 아직 설정되지 않았어요.'};
 const r=await (await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({act},o))})).json();
 if(r.ok){const p=act==='del'?{id:String(o.id)}:{id:String(act==='add'?r.id:o.id),g:o.g,b:o.b,s:o.s,gr:o.gr,c:o.c,n:o.n};if(act==='add')p.img='';const L=pend();L.push({t:Date.now(),a:act,p});ls(PK,L)}
 return r}

window.addEventListener('pagehide',saveDraft);
(async()=>{for(let i=0;i<5;i++){try{D=await loadData();break}catch(e){await wait(1500*(i+1)+Math.random()*2000)}}const h=decodeURIComponent(location.hash.slice(1));if(DIV[h]){G=h;V='list'}render();
 setInterval(async()=>{if(document.hidden||V==='form')return;try{const n=await loadData();mine.forEach(p=>{if(!n.find(x=>x.id===p.id))n.push(p)});D=n;if(V!=='form')render()}catch(e){}},60000+Math.random()*60000)})();
</script></body></html>
